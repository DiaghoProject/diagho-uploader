# Input directories
metadata_dir: "path/to/metadata/input"   # Drop TSV or JSON metadata files here
files_dir: "path/to/biofiles/input"      # Drop VCF, BED, etc. biofiles here
archives_dir: "path/to/archives"         # Processed files (metadata + biofiles) are moved here after completion

# Diagho API
diagho_api:
  username: ""
  password: ""
  url: "http://hostname:8080/api/v1/"
  allow_insecure: true                   # Set true to disable SSL verification (e.g. self-signed cert or plain HTTP)

# Genome accessions (IDs as configured in the Diagho application)
accessions:
  GRCh37: 1
  GRCh38: 2

# CNV tabfile column mapping: 1-based column index → expected column name
tabfiles_columns_index: {"1": "CHROM", "2": "START", "3": "END"}
tabfiles_zero_based: true    # true for BED (0-based), false for 1-based formats

dedup_biofiles: false        # Remove duplicate variants in uploaded biofiles

# Email notifications (not yet active — pending logging/mail utils)
emails:
  send_mail_flag: 1
  recipients: "user@example.fr"          # Comma-separated for multiple recipients

smtp:
  server: "servmail"
  port: 25
  use_tls: false
  from_email_format: "diagho-uploader-{hostname}@example.fr"
  username:                              # optional — leave blank for open relay
  password:                              # optional — leave blank for open relay

# Logging (not yet active — pending logging utils)
logging:
  log_level: "INFO"
  log_directory: "path/to/logs"
  log_rotation_when: "W0"               # W0 = every Monday
  log_rotation_interval: 1
  log_backup_count: 52
